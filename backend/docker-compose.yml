services:
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/restaurant_reservations
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_string}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
